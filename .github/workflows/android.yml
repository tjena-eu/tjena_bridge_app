# Builds the tjena Bridge Android app (bridge_app/) with its native programs
# (mautrix-whatsapp, relay, wacall) and publishes the APK.
#
#   push to main    -> tests, signed APK on the "edge" prerelease (replaced each time)
#   tag v1.2.3      -> tests, signed APK on the release v1.2.3 (tag must match pubspec.yaml)
#   pull request    -> tests only
#   manual run      -> tests, signed APK as a run artifact
#
# Signing secrets (repo or org): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Same key as tjena!chat; the build
# fails if the APK isn't signed with EXPECTED_CERT.
name: Android app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bridge_app/**"
      - "relay/**"
      - "wacall/**"
      - "android-binary/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "bridge_app/**"
      - "relay/**"
      - "wacall/**"
      - "android-binary/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NDK_VERSION: 28.2.13676358
  EXPECTED_CERT: a94bea045d790038948b9c57b339aee579d99b0e0c08ff4406dcebbca21f4446

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: |
            relay/go.sum
            wacall/go.sum

      - name: Go tests (relay, wacall)
        run: |
          (cd relay && go test ./...)
          (cd wacall && go test ./...)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter analyze and tests
        working-directory: bridge_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Kotlin unit tests
        working-directory: bridge_app
        run: |
          flutter build apk --config-only
          cd android && ./gradlew --no-daemon :app:testDebugUnitTest

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # releases
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          v="$(sed -n 's/^version: *//p' bridge_app/pubspec.yaml)"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "name=${v%%+*}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "${v%%+*}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml version $v"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: |
            relay/go.sum
            wacall/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -d "$ndk" ]]; then
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"

      - name: Native programs (mautrix-whatsapp, relay, wacall)
        run: bash android-binary/build.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see the top of this workflow)."
            exit 1
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/release.keystore"
          cat > "$dir/key.properties" <<EOF
          storeFile=$dir/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "TJENA_KEY_PROPERTIES=$dir/key.properties" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        working-directory: bridge_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../.build
          cp build/app/outputs/flutter-apk/app-release.apk ../.build/tjena-bridge.apk

      - name: Check signing certificate
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          out="$("$bt/apksigner" verify --print-certs .build/tjena-bridge.apk 2>&1)" || { echo "$out"; exit 1; }
          # Line wording differs between build-tools versions ("Signer #1 …",
          # "Signer (minSdkVersion=…) …"); take the first certificate digest.
          got="$(grep -m1 -i 'certificate SHA-256 digest:' <<< "$out" | sed 's/.*digest: *//' | tr -d '[:space:]:' | tr 'A-F' 'a-f' || true)"
          if [[ "$got" != "$EXPECTED_CERT" ]]; then
            echo "$bt/apksigner output:"; echo "$out"
            echo "::error::APK is signed with '$got', expected $EXPECTED_CERT. Not publishing."
            exit 1
          fi
          echo "Signed with the tjena key."

      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - uses: actions/upload-artifact@v4
        with:
          name: tjena-bridge-${{ steps.version.outputs.full }}
          path: .build/tjena-bridge.apk
          retention-days: 14

      - name: Publish edge prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create edge .build/tjena-bridge.apk --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" \
            --title "edge $VERSION (${GITHUB_SHA::7})" \
            --notes "Test build from main, replaced on every update. Commit $GITHUB_SHA."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" .build/tjena-bridge.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            pre=""; [[ "$tag" == *-* ]] && pre="--prerelease"
            gh release create "$tag" .build/tjena-bridge.apk --repo "$GITHUB_REPOSITORY" \
              $pre --title "tjena Bridge $VERSION" --generate-notes
          fi
